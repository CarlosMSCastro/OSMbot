[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osmbot"
version = "0.20.1"
description = "Automation helpers for Online Soccer Manager (independent project)."
requires-python = ">=3.11"
dependencies = ["playwright>=1.45", "certifi", "PySide6-Essentials>=6.7", "segno>=1.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
osmbot = "osmbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
osmbot = ["gui/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
