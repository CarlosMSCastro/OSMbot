[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osmbot"
version = "0.8.0"
description = "Automation helpers for Online Soccer Manager (independent project)."
requires-python = ">=3.11"
dependencies = ["playwright>=1.45", "certifi"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
osmbot = "osmbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
