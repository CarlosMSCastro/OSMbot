<?xml version="1.0" encoding="utf-8"?>
<!-- OSMbot: calendar for the daily rewards (owner, 2026-10-15), in the style of timer.svg: silver body, blue top, gloss. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6E6E6"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CCCCCC"/>
      <stop offset="1" stop-color="#999999"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00BAFE"/>
      <stop offset="0.55" stop-color="#008CF0"/>
      <stop offset="1" stop-color="#0064AB"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#999999"/>
      <stop offset="0.5" stop-color="#F2F2F2"/>
      <stop offset="1" stop-color="#B3B3B3"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- shadow -->
  <rect x="44" y="64" width="212" height="208" rx="34" fill="#091644" opacity="0.25"/>
  <!-- silver rim and white page -->
  <rect x="40" y="56" width="220" height="210" rx="34" fill="url(#rim)"/>
  <rect x="48" y="64" width="204" height="194" rx="28" fill="url(#body)"/>
  <!-- blue header -->
  <path d="M48 92 a28 28 0 0 1 28 -28 h148 a28 28 0 0 1 28 28 v26 h-204 z" fill="url(#top)"/>
  <path d="M56 92 a22 22 0 0 1 22 -22 h144 a22 22 0 0 1 22 22 v4 h-188 z" fill="url(#gloss)"/>
  <!-- binder rings -->
  <rect x="88" y="34" width="22" height="56" rx="11" fill="url(#ring)"/>
  <rect x="190" y="34" width="22" height="56" rx="11" fill="url(#ring)"/>
  <circle cx="99" cy="84" r="5" fill="#0064AB"/>
  <circle cx="201" cy="84" r="5" fill="#0064AB"/>
  <!-- days: a 4 x 3 grid, today in blue -->
  <g fill="#BFBFBF">
    <rect x="72" y="136" width="30" height="26" rx="6"/>
    <rect x="114" y="136" width="30" height="26" rx="6"/>
    <rect x="156" y="136" width="30" height="26" rx="6"/>
    <rect x="198" y="136" width="30" height="26" rx="6"/>
    <rect x="72" y="174" width="30" height="26" rx="6"/>
    <rect x="114" y="174" width="30" height="26" rx="6"/>
    <rect x="198" y="174" width="30" height="26" rx="6"/>
    <rect x="72" y="212" width="30" height="26" rx="6"/>
    <rect x="114" y="212" width="30" height="26" rx="6"/>
    <rect x="156" y="212" width="30" height="26" rx="6"/>
  </g>
  <rect x="156" y="174" width="30" height="26" rx="6" fill="#008CF0"/>
  <rect x="156" y="174" width="30" height="11" rx="5" fill="#00BAFE" opacity="0.7"/>
</svg>
